<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="BeeEarn - Premium Ad Earning Platform. Monetize your buzz and earn up to $0.13 per click.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>BeeEarn - Premium Ad Platform</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23FFD700'>🐝</text></svg>">
    
    <!-- Correct Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
 
    <!-- Navigation -->
    <nav class="glass-panel">
        <div class="logo">BEE<span>EARN</span></div>
        <div class="nav-buttons">
            <button id="loginBtn" class="glow-btn">Login</button>
            <button id="joinBtn" class="glow-btn primary">Join</button>
            <button id="logoutBtn" class="glow-btn hidden">Logout</button>
        </div>
    </nav>

    <!-- Main Dashboard (Hidden until logged in) -->
    <div id="dashboard" class="hidden">
        
        <!-- Stats Bar -->
        <div class="stats-container glass-panel">
            <div class="stat-box">
                <p>Balance</p>
                <h2 id="balanceDisplay">$0.00</h2>
            </div>
            <div class="stat-box">
                <p>Clicks Today</p>
                <h2 id="clicksDisplay">0 / 12</h2>
            </div>
            <button id="withdrawBtn" class="glow-btn action">Withdraw</button>
        </div>

        <!-- Ad Section -->
        <div class="ad-container glass-panel">
            <h3>Select Ad Type</h3>
            <div class="ad-controls">
                <button id="showSocialBtn" class="filter-btn active">Social Ads</button>
                <button id="showAdultBtn" class="filter-btn">Adult Ads</button>
            </div>

            <div id="adSpace" class="ad-zone">
                <!-- Social Ads -->
                <div id="socialAdPlaceholder" class="ad-banner">
                    <script async="async" data-cfasync="false" src="https://pl31731410.profitableratecpmnetwork.com/a0c34ff749fed1fd38ae64f0bef2f988/invoke.js"></script>
                    <div id="container-a0c34ff749fed1fd38ae64f0bef2f988"></div>
                </div>
                
                <!-- Adult Ads -->
                <div id="adultAdPlaceholder" class="ad-banner hidden">
                    <script async="async" data-cfasync="false" src="https://pl31731400.profitableratecpmnetwork.com/6bf4cd1cea9871d4ec746fc060c20b7b/invoke.js"></script>
                    <div id="container-6bf4cd1cea9871d4ec746fc060c20b7b"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hero Section (Visible only when logged out) -->
    <div id="hero" class="hero-section">
        <h1>Monetize Your <span class="highlight">Buzz</span></h1>
        <p>Join the hive and start earning today.</p>
    </div>

    <!-- Modals -->
    
    <!-- Join Modal -->
    <div id="joinModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2>Join the Hive</h2>
            <input type="email" id="joinEmail" placeholder="Email" class="premium-input" required>
            <input type="text" id="joinUser" placeholder="Username" class="premium-input" required>
            <input type="password" id="joinPass" placeholder="Password (min 6 chars)" class="premium-input" required minlength="6">
            
            <div class="terms-check">
                <input type="checkbox" id="agreeTerms" required>
                <label>I agree to the <span id="openTerms" class="link-text">Terms and Conditions</span></label>
            </div>

            <button id="submitJoin" class="glow-btn full-width">Create Account</button>
            <button type="button" class="close-modal">✕</button>
        </div>
    </div>

    <!-- Terms Modal (Nested) -->
    <div id="termsModal" class="modal-overlay hidden" style="z-index: 2000;">
        <div class="modal-content glass-panel scrollable-modal">
            <h2>Terms & Conditions</h2>
            <div class="terms-text">
                <!-- Content populated by script.js -->
            </div>
            <button id="closeTerms" class="glow-btn">Close</button>
            <button type="button" class="close-modal">✕</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2>Login</h2>
            <input type="text" id="loginUser" placeholder="Username" class="premium-input" required>
            <input type="password" id="loginPass" placeholder="Password" class="premium-input" required>
            <button id="submitLogin" class="glow-btn full-width">Enter Hive</button>
            <button type="button" class="close-modal">✕</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2>Withdraw Funds</h2>
            <p>Current Balance: <span id="modalBalance">$0.00</span></p>
            
            <div class="payment-methods">
                <div class="method-card" data-method="paypal" data-min="50">
                    <img src="paypal.png" alt="PayPal">
                    <span>PayPal ($50 Min)</span>
                </div>
                <div class="method-card" data-method="bitcoin" data-min="65">
                    <img src="bitcoin.png" alt="Bitcoin">
                    <span>Bitcoin ($65 Min)</span>
                </div>
                <div class="method-card" data-method="usdc" data-min="65">
                    <img src="usdc.png" alt="USDC">
                    <span>USDC ($65 Min)</span>
                </div>
            </div>

            <div id="paymentDetails" class="hidden">
                <input type="text" id="walletAddress" placeholder="Enter Payment Details/Address" class="premium-input" required>
                <button id="confirmWithdraw" class="glow-btn full-width">Request Withdrawal</button>
            </div>
            <p id="withdrawMsg" class="error-text"></p>
            <button type="button" class="close-modal">✕</button>
        </div>
    </div>

    <!-- Custom Notification Container -->
    <div id="notificationArea"></div>

    <script src="script.js"></script>
</body>
</html>
